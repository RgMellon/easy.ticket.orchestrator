services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: easy_ticket
      POSTGRES_PASSWORD: easy_ticket
      POSTGRES_DB: easy_ticket
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U easy_ticket']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
